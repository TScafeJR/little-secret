root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/cli"
  bin = "./tmp/main"
  args_bin = ["srv", "local"]
  include_dir = ["cmd", "internal"]
  include_ext = ["go", "json"]
  exclude_dir = ["tmp", "node_modules", "src", "public", "supabase", "tests-examples", "scripts", "makefiles", ".storybook"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true
